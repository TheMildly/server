[package]
name = "mildly-server"
version = "0.1.0"
edition = "2024"
description = "Mildly Server: the personal server the Mildly app pairs with"
license = "Apache-2.0"
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22"
bollard = "0.21.1"
bytes = "1.12.1"
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.12"
hmac = "0.12"
hostname = "0.4.2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
portable-pty = "0.9.0"
qrcode = "0.14.1"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sysinfo = "0.40.4"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
