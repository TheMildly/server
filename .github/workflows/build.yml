# Builds the engine for Linux on both processor families.
#   - Actions → Build → Run workflow builds them and attaches them to the run. With "Publish
#     a release" ticked it also tags the commit v<version in Cargo.toml> and publishes a
#     GitHub release with both binaries and install.sh, which is where the installer
#     downloads from. Pushing such a tag does the same.
name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release for the version in Cargo.toml'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an older Ubuntu so the binary runs on older distributions too.
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build
        run: cargo build --release --locked

      - name: Collect
        run: |
          mkdir -p out
          cp target/release/mildly-server "out/mildly-server-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: mildly-server-${{ matrix.arch }}
          if-no-files-found: error
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Work out the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh LICENSE NOTICE out/
          (cd out && sha256sum mildly-server-* install.sh > SHA256SUMS)
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Mildly Server $TAG" --generate-notes
