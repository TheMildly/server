# Builds the engine for Linux on both processor families.
#   - A tag such as v0.1.0 publishes a GitHub release with both binaries and install.sh,
#     which is where the installer downloads from.
#   - Actions → Build → Run workflow only builds them and attaches them to the run.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an older Ubuntu so the binary runs on older distributions too.
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build
        run: cargo build --release --locked

      - name: Collect
        run: |
          mkdir -p out
          cp target/release/mildly-server "out/mildly-server-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: mildly-server-${{ matrix.arch }}
          if-no-files-found: error
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh LICENSE NOTICE out/
          (cd out && sha256sum mildly-server-* install.sh > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" out/* --title "Mildly Server $GITHUB_REF_NAME" --generate-notes
